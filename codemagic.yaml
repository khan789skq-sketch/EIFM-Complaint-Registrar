workflows:
  eifm-android:
    name: EIFM Android APK
    max_build_duration: 60
    environment:
      flutter: stable

    scripts:
      - name: Prepare Android project
        script: |
          set -eu
          test -f pubspec.yaml
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name eifm_wcc_ppm .
          fi
          mkdir -p lib
          if [ -f main.dart ]; then cp main.dart lib/main.dart; fi
          if [ -f pages.dart ]; then cp pages.dart lib/pages.dart; fi
          test -f lib/main.dart
          test -f lib/pages.dart

      - name: Install dependencies
        script: flutter pub get

      - name: Configure Android
        script: |
          set -eu
          python3 - <<'PY'
          import os
          from pathlib import Path

          app = Path('android/app')
          gradle = app / 'build.gradle'
          kts = app / 'build.gradle.kts'

          if kts.exists():
              p = kts
              override = '\nandroid { compileSdk = 36 }\n'
          elif gradle.exists():
              p = gradle
              override = '\nandroid { compileSdkVersion 36 }\n'
          else:
              raise SystemExit('Android Gradle file missing')

          p.write_text(p.read_text() + override)

          cache = Path(
              os.environ.get(
                  'PUB_CACHE',
                  str(Path.home() / '.pub-cache')
              )
          )

          files = list(
              (cache / 'hosted').glob(
                  '*/file_picker-*/android/build.gradle'
              )
          )
          files += list(
              (cache / 'hosted').glob(
                  '*/file_picker-*/android/build.gradle.kts'
              )
          )

          for p in files:
              if p.suffix == '.kts':
                  override = '\nandroid { compileSdk = 36 }\n'
              else:
                  override = '\nandroid { compileSdkVersion 36 }\n'
              p.write_text(p.read_text() + override)

          manifest = Path(
              'android/app/src/main/AndroidManifest.xml'
          )
          s = manifest.read_text()

          permission = (
              '<uses-permission '
              'android:name="android.permission.INTERNET" />'
          )

          if permission not in s:
              pos = s.find('>')
              if pos == -1:
                  raise SystemExit('Invalid AndroidManifest.xml')
              s = s[:pos+1] + '\n    ' + permission + s[pos+1:]

          import re
          s = re.sub(
              r'android:label="[^"]*"',
              'android:label="EIFM WCC &amp; PPM"',
              s,
              count=1
          )

          manifest.write_text(s)
          print('Android configuration completed')
          PY

      - name: Build release APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
