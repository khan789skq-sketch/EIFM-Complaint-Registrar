workflows:
  eifm-app:
    name: EIFM App (Android & iOS)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: 3.27.4
    scripts:
      - name: Create project and arrange files
        script: |
          mkdir -p /tmp/src
          cp main.dart pages.dart pubspec.yaml /tmp/src/ 2>/dev/null || true
          flutter create --platforms=android .
          mkdir -p lib
          cp /tmp/src/main.dart lib/main.dart 2>/dev/null || true
          cp /tmp/src/pages.dart lib/pages.dart 2>/dev/null || true
          cp /tmp/src/pubspec.yaml pubspec.yaml 2>/dev/null || true
      - name: Get packages
        script: flutter pub get
      - name: Build Android APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
