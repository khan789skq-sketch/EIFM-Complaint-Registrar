workflows:
  eifm-android-ios:
    name: EIFM Android + iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:

      # 1. Create Flutter project with BOTH Android and iOS folders dynamically
      - name: Create Android + iOS project
        script: |
          set -e

          mkdir -p /tmp/eifm_source

          [ -f main.dart ] && cp main.dart /tmp/eifm_source/main.dart || true
          [ -f pages.dart ] && cp pages.dart /tmp/eifm_source/pages.dart || true
          [ -f pubspec.yaml ] && cp pubspec.yaml /tmp/eifm_source/pubspec.yaml || true

          flutter create \
            --platforms=android,ios \
            --project-name=eifm_app \
            --org=com.eifm \
            .

          mkdir -p lib

          [ -f /tmp/eifm_source/main.dart ] && cp /tmp/eifm_source/main.dart lib/main.dart || true
          [ -f /tmp/eifm_source/pages.dart ] && cp /tmp/eifm_source/pages.dart lib/pages.dart || true
          [ -f /tmp/eifm_source/pubspec.yaml ] && cp /tmp/eifm_source/pubspec.yaml pubspec.yaml || true

      # 2. Configure iOS permissions required by image picker
      - name: Configure iOS permissions
        script: |
          set -e

          PLIST="ios/Runner/Info.plist"

          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string EIFM needs camera access to take work completion photos." "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string EIFM needs photo library access to select work completion photos." "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string EIFM needs permission to save photos." "$PLIST" 2>/dev/null || true
          fi

      # 3. Configure Android permissions and app name
      - name: Configure Android
        script: |
          set -e

          M="android/app/src/main/AndroidManifest.xml"

          if [ -f "$M" ]; then
            sed -i.bak 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$M"
            sed -i.bak 's#android:label="[^"]*"#android:label="EIFM"#' "$M"
            rm -f "$M.bak"
          fi

      # 4. Get Flutter packages
      - name: Get packages
        script: |
          set -e
          flutter pub get

      # 5. Check Flutter project
      - name: Analyze project
        script: |
          flutter analyze --no-fatal-infos || true

      # 6. Build Android APK
      - name: Build Android APK
        script: |
          set -e
          flutter build apk --release

      # 7. Build Android App Bundle
      - name: Build Android AAB
        script: |
          set -e
          flutter build appbundle --release

      # 8. Build iOS without signing
      - name: Build iOS
        script: |
          set -e
          flutter build ipa --release --no-codesign

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - khan789skq@gmail.com
          
