workflows:
  eifm-android:
    name: EIFM Android APK
    max_build_duration: 60
    instance_type: linux
    environment:
      flutter: stable
    scripts:
      - name: Prepare Flutter Android project
        script: |
          flutter create --platforms=android --project-name eifm_wcc_ppm .
          mkdir -p lib
          cp main.dart lib/main.dart
          cp pages.dart lib/pages.dart
      - name: Install dependencies
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
