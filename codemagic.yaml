workflows:
  eifm-android:
    name: EIFM Android APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Prepare Android project
        script: |
          set -eu
          test -f pubspec.yaml
          test -f main.dart
          test -f pages.dart
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name eifm_wcc_ppm .
          fi
          mkdir -p lib
          cp main.dart lib/main.dart
          cp pages.dart lib/pages.dart
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Configure and validate Android
        script: |
          set -eu
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path
          from xml.etree import ElementTree as ET

          app = Path('android/app')
          manifest = app / 'src/main/AndroidManifest.xml'
          if not manifest.is_file():
              raise SystemExit('ERROR: AndroidManifest.xml missing')
          android_ns = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', android_ns)
          name = '{' + android_ns + '}name'
          root = ET.parse(manifest).getroot()
          if root.tag != 'manifest':
              raise SystemExit('ERROR: invalid Android manifest root')
          if not any(e.tag == 'uses-permission' and e.get(name) == 'android.permission.INTERNET' for e in root):
              root.insert(0, ET.Element('uses-permission', {name: 'android.permission.INTERNET'}))
          application = root.find('application')
          if application is None:
              raise SystemExit('ERROR: Android application element missing')
          application.set('{' + android_ns + '}label', 'EIFM WCC & PPM')
          if not any(e.get(name) == 'com.yalantis.ucrop.UCropActivity' for e in application.findall('activity')):
              ET.SubElement(application, 'activity', {
                  name: 'com.yalantis.ucrop.UCropActivity',
                  '{' + android_ns + '}screenOrientation': 'portrait',
                  '{' + android_ns + '}theme': '@android:style/Theme.Material.Light.NoActionBar',
              })
          ET.indent(root, space='    ')
          ET.ElementTree(root).write(manifest, encoding='utf-8', xml_declaration=True)
          ET.parse(manifest)

          gradle = app / 'build.gradle'
          kts = app / 'build.gradle.kts'
          if kts.is_file():
              gradle_file = kts
              override = '\nandroid { compileSdk = 36 }\n'
          elif gradle.is_file():
              gradle_file = gradle
              override = '\nandroid { compileSdkVersion 36 }\n'
          else:
              raise SystemExit('ERROR: Android app Gradle file missing')
          gradle_file.write_text(gradle_file.read_text() + override)

          cache = Path(os.environ.get('PUB_CACHE', str(Path.home() / '.pub-cache')))
          for plugin in (cache / 'hosted').glob('*/file_picker-*/android/build.gradle*'):
              override = '\nandroid { compileSdk = 36 }\n' if plugin.suffix == '.kts' else '\nandroid { compileSdkVersion 36 }\n'
              plugin.write_text(plugin.read_text() + override)

          resources = app / 'src/main/res'
          for density in ('mdpi', 'hdpi', 'xhdpi', 'xxhdpi', 'xxxhdpi'):
              src = Path('android_icons') / ('mipmap-' + density) / 'ic_launcher.png'
              if not src.is_file() or src.read_bytes()[:8] != bytes((137,80,78,71,13,10,26,10)):
                  raise SystemExit('ERROR: missing/invalid icon: ' + str(src))
              dest = resources / ('mipmap-' + density)
              dest.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(src, dest / 'ic_launcher.png')
          adaptive = resources / 'mipmap-anydpi-v26'
          if adaptive.exists():
              for icon in adaptive.glob('ic_launcher*.xml'):
                  icon.unlink()
          print('PASS: Manifest XML, internet permission, app name, SDK and icons configured')
          PY
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
