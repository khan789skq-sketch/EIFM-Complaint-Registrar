workflows:
  eifm-android:
    name: EIFM Android APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Prepare Android project
        script: |
          set -eu
          test -f pubspec.yaml
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name eifm_wcc_ppm .
          fi
          mkdir -p lib
          if [ -f main.dart ]; then cp main.dart lib/main.dart; fi
          if [ -f pages.dart ]; then cp pages.dart lib/pages.dart; fi
          test -f lib/main.dart
          test -f lib/pages.dart
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Configure and validate Android
        script: |
          set -eu
          python3 EIFM_manifest_fix.py
          python3 -m pip install --user Pillow
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          from PIL import Image
          from xml.etree import ElementTree as ET
          app = Path('android/app')
          gradle = app/'build.gradle'
          kts = app/'build.gradle.kts'
          if kts.is_file():
              p, extra = kts, '\nandroid { compileSdk = 36 }\n'
          elif gradle.is_file():
              p, extra = gradle, '\nandroid { compileSdkVersion 36 }\n'
          else:
              raise SystemExit('Android app Gradle file missing')
          p.write_text(p.read_text()+extra)
          cache = Path(os.environ.get('PUB_CACHE', str(Path.home()/'.pub-cache')))
          for p in (cache/'hosted').glob('*/file_picker-*/android/build.gradle*'):
              extra = '\nandroid { compileSdk = 36 }\n' if p.suffix == '.kts' else '\nandroid { compileSdkVersion 36 }\n'
              p.write_text(p.read_text()+extra)
          logo = Path('EIFM_logo.jpg')
          if not logo.is_file():
              raise SystemExit('EIFM_logo.jpg missing')
          with Image.open(logo) as im:
              im.load()
              source = im.convert('RGBA')
          for density, size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              canvas = Image.new('RGBA',(size,size),'white')
              pic = source.copy()
              pic.thumbnail((int(size*.88),int(size*.88)),Image.Resampling.LANCZOS)
              canvas.alpha_composite(pic,((size-pic.width)//2,(size-pic.height)//2))
              dest = app/'src/main/res'/('mipmap-'+density)
              dest.mkdir(parents=True,exist_ok=True)
              canvas.convert('RGB').save(dest/'ic_launcher.png')
          adaptive = app/'src/main/res/mipmap-anydpi-v26'
          if adaptive.exists():
              for p in adaptive.glob('ic_launcher*.xml'):
                  p.unlink()
          ET.parse(app/'src/main/AndroidManifest.xml')
          print('Android manifest XML and logo validated')
          PYCODE
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
