workflows:
  eifm-android:
    name: EIFM Android
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Create android project and arrange files (lib folder auto)
        script: |
          mkdir -p /tmp/src
          cp main.dart pages.dart pubspec.yaml /tmp/src/
          flutter create --platforms=android --project-name eifm_app --org com.eifm .
          mkdir -p lib
          cp /tmp/src/main.dart lib/main.dart
          cp /tmp/src/pages.dart lib/pages.dart
          cp /tmp/src/pubspec.yaml pubspec.yaml
      - name: Patch manifest (internet + image crop + app name)
        script: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's#</application>#<activity android:name="com.yalantis.ucrop.UCropActivity" android:screenOrientation="portrait" android:theme="@style/Theme.AppCompat.Light.NoActionBar"/>\n    </application>#' $M
          sed -i 's#android:label="[^"]*"#android:label="EIFM"#' $M
      - name: App icon from EIFM_logo.jpg
        script: |
          python3 -m pip install pillow
          python3 -c "from PIL import Image,ImageChops; im=Image.open('EIFM_logo.jpg').convert('RGB'); bb=ImageChops.difference(im,Image.new('RGB',im.size,(255,255,255))).point(lambda p:255 if p>20 else 0).getbbox(); im=im.crop(bb); s=int(max(im.size)*1.3); o=Image.new('RGB',(s,s),(255,255,255)); o.paste(im,((s-im.size[0])//2,(s-im.size[1])//2)); o.resize((1024,1024)).save('icon.png')"
          flutter pub add dev:flutter_launcher_icons
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            image_path: "icon.png"
          EOF
          dart run flutter_launcher_icons
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
      - name: Build AAB
        script: flutter build appbundle --release
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
