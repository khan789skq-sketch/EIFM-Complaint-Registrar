workflows:
  eifm-android:
    name: EIFM Android APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Prepare Android project
        script: |
          set -eu
          test -f pubspec.yaml || { echo 'ERROR: pubspec.yaml missing in repository root'; exit 1; }
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name eifm_wcc_ppm .
          fi
          mkdir -p lib
          if [ -f main.dart ]; then cp main.dart lib/main.dart; fi
          if [ -f pages.dart ]; then cp pages.dart lib/pages.dart; fi
          test -f lib/main.dart
          test -f lib/pages.dart
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Set Android compile SDK to 36
        script: |
          set -eu
          python3 - <<'PY'
          import os
          from pathlib import Path

          app = Path('android/app')
          app_gradle = app / 'build.gradle'
          app_kts = app / 'build.gradle.kts'
          if app_kts.is_file():
              p = app_kts
              override = '\nandroid { compileSdk = 36 }\n'
          elif app_gradle.is_file():
              p = app_gradle
              override = '\nandroid { compileSdkVersion 36 }\n'
          else:
              raise SystemExit('ERROR: Android app Gradle file missing')
          p.write_text(p.read_text() + override)
          print('Set Android app compileSdk to 36:', p)

          cache = Path(os.environ.get('PUB_CACHE', str(Path.home() / '.pub-cache')))
          candidates = sorted((cache / 'hosted').glob('*/file_picker-*/android/build.gradle'))
          candidates += sorted((cache / 'hosted').glob('*/file_picker-*/android/build.gradle.kts'))
          if not candidates:
              raise SystemExit('ERROR: file_picker Gradle file missing in Pub cache')
          for p in candidates:
              if p.suffix == '.kts':
                  override = '\nandroid { compileSdk = 36 }\n'
              else:
                  override = '\nandroid { compileSdkVersion 36 }\n'
              p.write_text(p.read_text() + override)
              print('Set file_picker compileSdk to 36:', p)
          PY
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

