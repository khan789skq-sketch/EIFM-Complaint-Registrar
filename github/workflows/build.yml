name: Build EIFM Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.8
          channel: stable

      - name: Create project and arrange files
        run: |
          mkdir -p /tmp/src
          cp main.dart pages.dart pubspec.yaml /tmp/src/ 2>/dev/null || true
          flutter create --platforms=android --project-name eifm_app .
          rm -rf test
          mkdir -p lib
          cp /tmp/src/main.dart lib/main.dart 2>/dev/null || true
          cp /tmp/src/pages.dart lib/pages.dart 2>/dev/null || true
          cp /tmp/src/pubspec.yaml pubspec.yaml 2>/dev/null || true

      - name: Get packages
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: eifm-app-apk
          path: build/app/outputs/flutter-apk/*.apk
