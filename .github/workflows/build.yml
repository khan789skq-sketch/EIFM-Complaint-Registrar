
workflows:
  eifm-android:
    name: EIFM Android APK
    max_build_duration: 30
    instance_type: linux
    environment:
      flutter: stable

    scripts:
      - name: Create Android project
        script: |
          flutter create --platforms=android --project-name eifm_wcc_ppm .

      - name: Install dependencies
        script: |
          flutter pub get

      - name: Build APK
        script: |
          flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
