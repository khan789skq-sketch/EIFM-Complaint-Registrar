name: Build EIFM Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.8
          channel: stable

      - name: Prepare logo and clean pubspec
        run: |
          exec > >(tee -a /tmp/build.log) 2>&1
          mkdir -p /tmp/src assets
          cp main.dart pages.dart pubspec.yaml /tmp/src/ 2>/dev/null || true
          cp app_icon.png logo.png EIFM_logo.jpg /tmp/src/ 2>/dev/null || true
          echo '' | base64 -d > /tmp/embedded_logo.png
          cp /tmp/embedded_logo.png assets/logo.png
          python3 - <<'PY'
          import re
          s = open('pubspec.yaml').read().replace('\r\n', '\n')
          s = re.sub(r'(?m)^([A-Z])(\w*):', lambda m: m.group(1).lower() + m.group(2) + ':', s)
          m = re.search(r'(?m)^flutter:\s*$', s)
          base = s[:m.start()] if m else s
          base = base.rstrip('\n') + '\n\n'
          base += 'flutter:\n  uses-material-design: true\n  assets:\n    - assets/logo.png\n'
          open('pubspec.yaml', 'w').write(base)
          PY
          cp pubspec.yaml /tmp/pubspec_clean.yaml
          echo "== clean pubspec =="; cat pubspec.yaml
          ls -la assets

      - name: Create project and arrange files
        run: |
          exec > >(tee -a /tmp/build.log) 2>&1
          flutter create --platforms=android --project-name eifm_app .
          rm -rf test
          mkdir -p lib
          cp /tmp/src/main.dart lib/main.dart 2>/dev/null || true
          cp /tmp/src/pages.dart lib/pages.dart 2>/dev/null || true
          cp /tmp/pubspec_clean.yaml pubspec.yaml

      - name: Fix manifest and photo settings
        run: |
          exec > >(tee -a /tmp/build.log) 2>&1
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="EIFM"/' $M
          sed -i 's#</application>#    <activity android:name="com.yalantis.ucrop.UCropActivity" android:screenOrientation="portrait" android:theme="@style/Theme.AppCompat.Light.NoActionBar"/>\n    </application>#' $M
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:usesCleartextTraffic="true"#' $M
          cat $M

      - name: Get packages
        run: |
          exec > >(tee -a /tmp/build.log) 2>&1
          flutter pub get

      - name: Clean logo and app icon (optional - build continues if this fails)
        continue-on-error: true
        run: |
          exec > >(tee -a /tmp/build.log) 2>&1
          python3 -m pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageChops
          import os
          S = 1024
          im = None
          for p in ['/tmp/embedded_logo.png', '/tmp/src/app_icon.png', '/tmp/src/logo.png', '/tmp/src/EIFM_logo.jpg']:
              c = p
              if os.path.exists(p):
                  try:
                      t = Image.open(p)
                      t.load()
                      im = t.convert('RGBA')
                      print('using logo file:', c)
                      break
                  except Exception as e:
                      print('skipping broken image file:', c, e)
          if im is None:
              raise SystemExit('no valid logo image found')
          flat = Image.alpha_composite(Image.new('RGBA', im.size, (255, 255, 255, 255)), im).convert('RGB')
          diff = ImageChops.difference(flat, Image.new('RGB', flat.size, (255, 255, 255))).convert('L').point(lambda v: 255 if v > 25 else 0)
          box = diff.getbbox()
          if box:
              flat = flat.crop(box)
          def square(scale):
              canvas = Image.new('RGB', (S, S), (255, 255, 255))
              w, h = flat.size
              k = (S * scale) / max(w, h)
              r = flat.resize((max(1, int(w * k)), max(1, int(h * k))), Image.LANCZOS)
              canvas.paste(r, ((S - r.width) // 2, (S - r.height) // 2))
              return canvas
          square(0.86).save('assets/logo.png')
          square(0.92).save('icon_full.png')
          square(0.60).save('icon_fg.png')
          print('logo files written')
          PY
          flutter pub add --dev flutter_launcher_icons
          printf 'flutter_launcher_icons:\n  android: true\n  ios: false\n  image_path: "icon_full.png"\n  adaptive_icon_background: "#FFFFFF"\n  adaptive_icon_foreground: "icon_fg.png"\n' > flutter_launcher_icons.yaml
          dart run flutter_launcher_icons

      - name: Build Android APK (release - faster and smaller than debug)
        run: |
          exec > >(tee -a /tmp/build.log) 2>&1
          flutter build apk --release --no-shrink

      - name: Show error summary
        if: failure()
        run: |
          sleep 2
          echo '### Build error - last lines' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 70 /tmp/build.log >> $GITHUB_STEP_SUMMARY || echo "no log (failure happened in setup steps)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: eifm-app-apk
          path: build/app/outputs/flutter-apk/*.apk
