workflows:
  eifm-android:
    name: EIFM Android APK
    max_build_duration: 30
    instance_type: linux

    environment:
      flutter: stable

    scripts:
      - name: Create Flutter Android project
        script: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name eifm_wcc_ppm .
          fi

      - name: Install dependencies
        script: |
          flutter pub get

      - name: Build Android APK
        script: |
          flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
