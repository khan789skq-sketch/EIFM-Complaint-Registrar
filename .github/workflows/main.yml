      - name: Fix Android SDK version
        run: |
          flutter doctor -v
          SDK_FILE="android/app/build.gradle.kts"
          if [ -f "$SDK_FILE" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$SDK_FILE"
          fi

          SDK_FILE="android/app/build.gradle"
          if [ -f "$SDK_FILE" ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' "$SDK_FILE"
          fi
