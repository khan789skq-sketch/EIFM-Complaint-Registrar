name: EIFM Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android Flutter project
        shell: bash
        run: |
          set -e
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name eifm_wcc_ppm .
          fi
          mkdir -p lib
          if [ -f main.dart ]; then cp main.dart lib/main.dart; fi
          if [ -f pages.dart ]; then cp pages.dart lib/pages.dart; fi
          test -f lib/main.dart || { echo 'Missing lib/main.dart'; exit 1; }

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*flutter\.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
            sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i -E 's/compileSdkVersion[[:space:]]+flutter\.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
            sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/' android/app/build.gradle
          fi
          grep -n -E 'compileSdk|targetSdk|minSdk' android/app/build.gradle* || true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Force file_picker compile SDK 36
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          cache = Path(os.environ.get('PUB_CACHE', str(Path.home() / '.pub-cache')))
          paths = sorted((cache / 'hosted' / 'pub.dev').glob('file_picker-*/android/build.gradle'))
          if not paths:
              raise SystemExit('file_picker build.gradle not found')
          for path in paths:
              with path.open('a') as f:
                  f.write('\n// EIFM: override Android API level required by lifecycle dependency\nandroid { compileSdkVersion 36 }\n')
              print('Set compileSdkVersion 36 in', path)
          PYCODE

      - name: Build Android debug APK and save error log
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --debug --verbose 2>&1 | tee android-build.log

      - name: Upload build log for troubleshooting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EIFM-Android-Build-Log
          path: android-build.log
          if-no-files-found: ignore

      - name: Upload Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EIFM-WCC-PPM-Android-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          
