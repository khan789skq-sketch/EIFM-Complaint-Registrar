name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter Pub Get
        working-directory: EIFM-WCC-PPM
        run: flutter pub get

      - name: Build APK
        working-directory: EIFM-WCC-PPM
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EIFM-WCC-PPM-APK
          path: EIFM-WCC-PPM/build/app/outputs/flutter-apk/app-release.apk
