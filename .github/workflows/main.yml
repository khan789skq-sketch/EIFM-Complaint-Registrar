name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: EIFM-WCC-PPM
        run: npm install

      - name: Install Capacitor
        working-directory: EIFM-WCC-PPM
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build React app
        working-directory: EIFM-WCC-PPM
        run: npm run build

      - name: Create Capacitor config
        working-directory: EIFM-WCC-PPM
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.eifm.wccppm",
            "appName": "EIFM WCC PPM",
            "webDir": "dist"
          }
          EOF

      - name: Add Android platform
        working-directory: EIFM-WCC-PPM
        run: npx cap add android

      - name: Sync Android
        working-directory: EIFM-WCC-PPM
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        working-directory: EIFM-WCC-PPM/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EIFM-WCC-PPM-APK
          path: EIFM-WCC-PPM/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
